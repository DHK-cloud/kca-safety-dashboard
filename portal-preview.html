  if(c.warnings.some(x=>x.type==='태풍')||(!c.indoor&&(c.temp!==null&&c.temp>=38||c.air!==null&&c.air<=-13))||(c.high&&c.gust!==null&&c.gust>=14)||c.thunder||(!c.indoor&&c.temp!==null&&c.temp>=35&&c.minutes!==null&&c.minutes>=60))add('stop','작업중지·대피 후 안전담당관 보고');
  if(c.indoor&&c.warnings.some(x=>x.type==='폭염'))add('heat-rest','냉방이 어려운 실내: 휴식·수분 섭취',10);
  else if(!c.indoor&&(c.risks.includes('폭염')||c.temp!==null&&c.temp>=31))add('heat-rest','그늘·통풍 장소 휴식·수분 섭취',c.temp!==null&&c.temp>=33&&c.minutes!==null&&c.minutes>=120?20:0);
  if(c.risks.includes('결빙·한파')&&!(c.air!==null&&c.air<=-13&&!c.indoor))add('cold-rest','방한 조치·온기 휴식',10);
  if(!c.indoor&&c.temp!==null&&c.temp>=35)add('volume','실외 검사 물량을 일일 80% 수준으로 조정');
  if(c.warnings.some(x=>['강풍','호우','대설'].includes(x.type)&&x.level==='경보'))add('indoor','실내 검사 위주로 일정 조정');
  if(c.warnings.some(x=>['강풍','호우','대설'].includes(x.type)&&x.level==='주의보'))add('relocate','기상 영향이 적은 지역으로 일정 조정');

  if(c.risks.includes('추락'))add('fall','난간·안전대·개구부 통제 후 검사');
  if(c.risks.includes('낙하물'))add('falling','장비 체결·하부 출입 통제 후 검사');
  add('done','현장 조치 후 검사 진행');add('postpone','검사 연기·일정 조정');add('progress','안전 조치 중');add('stop','작업중지·대피 후 안전담당관 보고');add('other','기타 조치 직접 기록');return out;
 }
 function actionRecord(d){const list=actions(d),selected=list.find(x=>x.id===d.actionChoice);if(!selected)return d.action||'';let text=selected.label;if(['heat-rest','cold-rest'].includes(selected.id)){const mins=numeric(d.restMinutes);text+=' · 실제 휴식 '+(mins===null?'시간 미입력':mins+'분');}if(d.actionNote?.trim())text+='\n'+d.actionNote.trim();return text;}
 function narrative(d){
  if(d.result==='clear')return '현장에 해당하는 점검항목을 확인했으며 이상이 없었습니다.';
  if(d.result!=='risk')return '';
  const c=context(d),risks=c.risks;if(!risks.length)return '';

  if(risks.includes('폭염')&&c.temp!==null)values.push('체감온도 '+c.temp+'°C');
  if(risks.includes('강풍·낙뢰')&&c.gust!==null)values.push('순간풍속 '+c.gust+'m/s');
  if(risks.includes('폭우·폭설')){if(c.rain!==null)values.push('1시간 강수 '+c.rain+'mm');if(c.snow>0)values.push('1시간 강설 '+c.snow+'cm');if(c.depth>0)values.push('적설 '+c.depth+'cm');}

  if(values.length)out.push((d.weather?'참고 예보':'입력 수치')+' '+values.join(' / ')+'.');
  const mins=numeric(d.restMinutes),actions={
    evacuate:'작업을 중지하고 안전한 곳으로 대피한 후 관계기관에 신고했습니다.',
    stop:'작업을 중지하고 안전한 곳으로 대피한 후 안전담당관에게 보고했습니다.',

    volume:'실외 검사 물량을 일일 80% 수준으로 조정했습니다.',
    indoor:'실내 검사 위주로 일정을 조정했습니다.',relocate:'기상 영향이 적은 지역으로 검사 일정을 조정했습니다.',
    secure:'장비·공구를 고정하고 현장 안전을 확보했습니다.',slip:'현장에 필요한 배수·제설·미끄럼 방지 조치를 했습니다.',
    power:'물기를 제거하고 전원 안전을 확보한 후 검사를 진행했습니다.',fall:'난간·안전대와 개구부 통제로 안전을 확보한 후 검사를 진행했습니다.',
    falling:'장비를 견고하게 체결하고 하부 출입을 통제한 후 검사를 진행했습니다.',
    done:'현장에 필요한 안전 조치를 마친 후 검사를 진행했습니다.',postpone:'검사를 연기하고 일정을 조정했습니다.',
    progress:'현재 안전 조치를 진행 중이며, 위험이 해소되기 전에는 검사를 재개하지 않았습니다.',other:'[실제 위험 상황과 조치 내용을 직접 적어주세요.]'
  };if(actions[d.actionChoice])out.push(actions[d.actionChoice]);return out.join('\n');

  function art(c){if(c.locked)return `<div class="art locked-art"><span class="art-label">${esc(categoryName(c.categoryId))}</span>${icon('lock')}</div>`;const cat=c.categoryId;const cls=cat==='ai'?'ai':cat==='docs'?'docs':cat==='marine'?'marine':cat==='season'?'season':'';const name=cat==='ai'?'ai':cat==='docs'?'file':cat==='marine'?'ship':cat==='season'?'weather':'check';const thumbnail=c.locked?'':(['cards','photo','video'].includes(c.format)?imageUrl(c.thumbnail||c.url):safeUrl(c.thumbnail));return thumbnail?`<div class="asset-cover ${c.format==='video'?'video':''}"><img class="thumb" src="${esc(thumbnail)}" alt="" loading="lazy" referrerpolicy="no-referrer"></div>`:`<div class="art ${cls}"><span class="art-label">${esc(categoryName(cat))}</span><span class="art-title">${esc(c.title)}</span>${icon(name)}${state.data.demo?'<span class="sample-tag">구성 예시</span>':''}</div>`;}
  function card(c){const locked=!!c.locked,access=c.visibility==='password'?'비밀번호':c.visibility==='staff'?'허용 계정':'';return `<article class="content-card ${locked?'is-locked':''}"><button class="card-hit" data-content="${esc(c.id)}" aria-label="${esc(c.title)} ${locked?'열람':'상세보기'}">${art(c)}<div class="card-copy"><div class="tags"><span class="format">${esc(formats[c.format]||'자료')}${c.format==='cards'&&['pdf','ppt'].includes(c.sourceFormat)?' · '+c.sourceFormat.toUpperCase():''}</span><span>${esc(categoryName(c.categoryId))}</span>${access?`<span class="access-tag">${icon(locked?'lock':'check')}${esc(access)}</span>`:''}</div><h3>${esc(c.title)}</h3>${c.summary?`<p>${esc(c.summary)}</p>`:''}<div class="card-bottom"><span>${esc(c.date||'등록 자료')}</span><span>${locked?'잠금 해제':c.format==='video'?'영상 보기':'자료 열기'} ↗</span></div></div></button>${window.KCA_AUTH?.session?.role==='admin'&&!c.parentId?`<button class="catalog-edit" data-edit-content="${esc(c.id)}">내용·열람 설정 수정</button>`:''}</article>`;}

  function recentPreviews(){const rows=projectAssets(state.data.contents).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))),photo=rows.find(c=>c.format==='cards'&&!c.campaignId),video=rows.find(c=>c.format==='video');return `<section class="section"><div class="section-head"><div><span class="eyebrow">LATEST UPDATES</span><h2>최근 카드뉴스 · 영상</h2></div><button class="text-button" data-route="library">자료 모아보기 ↗</button></div><div class="latest-news-grid">${photo?`<button class="latest-news" data-content="${esc(photo.id)}"><img src="${esc(imageUrl(photo.url))}" alt="${esc(photo.title)}" loading="lazy"><div class="news-copy"><span class="news-label">카드뉴스 · 크게 보기</span><strong>${esc(photo.title)}</strong></div></button>`:'<div class="empty">새 카드뉴스를 등록하면 여기에 표시됩니다.</div>'}${video?`<article class="latest-news video"><div class="home-video-preview">${mediaPreview(video.url,'video',video.title).replace('loading="eager"','loading="lazy"')}</div><div class="news-copy"><span class="news-label">영상 · ${esc(video.duration||'바로 보기')}</span><h3>${esc(video.title)}</h3><button class="text-button" data-content="${esc(video.id)}">영상 열기 ↗</button></div></article>`:'<div class="empty">공개 교육영상을 등록하면 여기에 표시됩니다.</div>'}</div></section>`;}

 function updateWeatherIssues(d){const c=KCA_GUIDANCE.context(d),risks=c.risks,items=[],add=(key,label,unit,cls)=>items.push({key,label,unit,cls});if(risks.includes('폭염')||c.temp!==null&&c.temp>=31)add('feelsLike','체감온도','°C','heat');if(risks.includes('강풍·낙뢰')||c.gust!==null&&c.gust>=14)add('gust','순간풍속','m/s','wind');if(risks.includes('폭우·폭설')||c.rain>0)add('rainHourly','1시간 강수','mm','rain');if(risks.includes('폭우·폭설')||c.snow>0)add('snowHourly','1시간 강설','cm','snow');if(c.depth>0||risks.includes('결빙·한파'))add('snowDepth','적설 깊이','cm','snow');if(risks.includes('결빙·한파')||c.air!==null&&c.air<=0)add('temperature','기온','°C','cold');$('#weatherIssues').innerHTML=items.map(x=>`<div class="weather-issue ${x.cls}"><small>${x.label}</small><strong>${A().esc(d[x.key]!==''&&d[x.key]!==null&&d[x.key]!==undefined?d[x.key]:'미확인')}<span>${x.unit}</span></strong></div>`).join('');$('#heatDuration').hidden=c.indoor||c.temp===null||c.temp<33;}
 function rules(k){const v=S().sites[k];$('#siteRules').innerHTML=`<strong>${A().esc(v.name)}</strong><ul class="manual-list">${v.rules.map(r=>`<li>${A().esc(r)}</li>`).join('')}</ul>`;}
 function profile(kind){const d=drafts[kind];A().showDialog('내 정보',`<form id="profileForm"><div class="form-grid"><label>이름<input name="inspector" required maxlength="60" value="${A().esc(d.inspector)}" autocomplete="name"></label><label>소속<input name="department" required maxlength="80" value="${A().esc(d.department)}"></label></div><p class="form-hint">이름·소속만 이 기기에 기억합니다. 기록과 파일은 Google에 보관합니다.</p><button class="save-report" type="submit">확인</button></form>`);$('#profileForm').onsubmit=e=>{e.preventDefault();const f=e.target;d.inspector=f.elements.inspector.value.trim();d.department=f.elements.department.value.trim();try{localStorage.setItem('kca-profile',JSON.stringify({inspector:d.inspector,department:d.department}));}catch{}$('#detail').close();$('#profileLabel').textContent=d.inspector+' · '+d.department;};}
 function capture(k){const f=$('#reportForm'),d=drafts[k];if(!f)return;if(k==='stop'){for(const n of ['department','inspector','address','reason'])d[n]=f.elements[n].value.trim();d.when=f.elements.date.value+'T00:00';d.region=inferRegion(d.address);d.result='risk';d.decision='작업중지 및 보고';d.action='';d.notified=false;d.checks=[];d.checkNotes=[];return;}for(const name of ['when','address','place','reason','action','photoUrl','region','recommendedAction','actionChoice','actionNote','restMinutes','feelsLike','workMinutes','temperature','gust','wind','rainHourly','snowHourly','snowDepth'])if(f.elements[name])d[name]=f.elements[name].value;d.site=f.querySelector('[name=site]:checked')?.value||'other';d.result=f.querySelector('[name=result]:checked')?.value||(k==='stop'?'risk':'');d.risks=[...f.querySelectorAll('[name=risk]:checked')].map(x=>x.value);if(d.weather){d.weather.entered={};for(const n of ['temperature','feelsLike','gust','wind','rainHourly','snowHourly','snowDepth'])d.weather.entered[n]=f.elements[n]?.value??'';}d.actionSchemaVersion=3;d.actionConfirmed=!!f.elements.actionConfirmed?.checked;d.notified=!!f.elements.notified?.checked;d.decision=k==='stop'?'작업중지 및 보고':d.result==='clear'?'이상 없음 (해당 항목 간편 확인)':'위험요인 있음';d.checks=[];d.checkNotes=[];}
 function inferRegion(address){const groups={서울:['서울'],부산:['부산'],대구:['대구'],인천:['인천'],광주:['광주'],대전:['대전'],울산:['울산'],세종:['세종'],경기:['경기도','경기 '],강원:['강원'],충북:['충청북','충북'],충남:['충청남','충남'],전북:['전북','전라북'],전남:['전라남','전남'],경북:['경상북','경북'],경남:['경상남','경남'],제주:['제주']};return Object.entries(groups).find(([,a])=>a.some(s=>address.startsWith(s)))?.[0]||'';}
 async function locate(k){drafts[k].addressTouched=false;const target=$('#locationStatus'),d=drafts[k];target.textContent='현재 위치를 찾고 있습니다…';try{const p=await KCA_LOCATION.locate();d.address=p.address;d.region=inferRegion(p.address);d.locationAccuracy=p.accuracy;d.locationSource='GPS 주소 추정';if($('#reportForm')&&A().state.route===k){$('#reportForm').elements.address.value=p.address;if($('#reportForm').elements.region)$('#reportForm').elements.region.value=d.region;target.innerHTML='Google로 채운 주소가 맞는지 확인해 주세요.';}dirty=true;if(k==='report')weatherRefresh(k);}catch(e){if(target.isConnected)target.textContent=e.message;}}
 function automaticLocation(k,p){const d=drafts[k],f=$('#reportForm'),today=new Date(Date.now()+9*3600000).toISOString().slice(0,10);if(!d||d.savedId||d.addressTouched||d.when.slice(0,10)!==today||d.address&&d.locationSource!=='GPS 주소 추정'||d.address===p.address)return;d.address=p.address;d.region=inferRegion(p.address);d.locationAccuracy=p.accuracy;d.locationSource='GPS 주소 추정';if(A().state.route===k&&f){f.elements.address.value=p.address;if(f.elements.region)f.elements.region.value=d.region;$('#locationStatus').textContent='위치에서 자동 입력했습니다. 주소가 맞는지 확인하세요.';if(k==='report'){d.weatherEdited=[];weatherRefresh(k);}}}
 window.addEventListener('kca:location',e=>{if(['report','stop'].includes(A().state.route))automaticLocation(A().state.route,e.detail);});
 function validate(k){const f=$('#reportForm'),d=drafts[k];if(!f.reportValidity())return false;if(!d.inspector){profile(k);return false;}if((k!=='stop'&&d.result==='risk')&&(!d.risks.length||!d.action)){A().toast('위험요인과 조치를 선택해 주세요.');return false;}if(k==='report'&&d.result==='risk'&&!d.actionConfirmed){A().toast('실제 조치·진행 상태를 확인해 주세요.');return false;}if(k==='report'&&d.result==='risk'&&(!d.action?.trim()||d.action.includes('[실제 위험'))){A().toast('최종 기록에 실제 위험과 조치를 적어주세요.');return false;}if(k==='stop'&&!d.reason.trim()){A().toast('상세 사유를 입력해 주세요.');return false;}if(d.photoUrl&&!A().safeUrl(d.photoUrl,['drive.google.com','docs.google.com'])){A().toast('참고 자료는 Drive 링크로 연결해 주세요.');return false;}return true;}
 function finalized(d){if(d.kind==='작업중지권')return {...d,reason:d.reason.trim()};return {...d,risks:d.result==='clear'?[]:d.risks,reason:d.result==='clear'?'이상 없음':d.risks.join('·')+' 위험 확인',action:d.action.trim(),recommendedAction:'',actionConfirmed:d.result==='clear'?false:d.actionConfirmed,actionChoice:d.result==='clear'?'done':d.actionChoice,restMinutes:d.result==='clear'?null:d.restMinutes,actionNote:'',actionSchemaVersion:3};}
 async function save(k){capture(k);if(!validate(k))return;const d=finalized(drafts[k]),b=$('#reportForm [type=submit]'),t=$('#saveStatus');if(!A().apiUrl()){t.textContent='아직 Google에 저장되지 않았습니다. 미리보기에서 초안을 보관할 수 있습니다.';return;}b.disabled=true;t.textContent='저장 중…';try{await KCA_AUTH.ensureLogin();if(k==='stop'){const photos=photoBuffers.get(d.id)||[];const uploaded=[];for(let i=0;i<photos.length;i++){t.textContent='사진 '+(i+1)+'/'+photos.length+' 저장 중…';const p=photos[i];if(!p.uploaded)p.uploaded=await KCA_AUTH.rpc('uploadReportPhoto',{reportId:d.id,index:i,base64:p.src.split(',')[1]});uploaded.push(p.uploaded);}d.photos=uploaded;drafts[k].photos=uploaded;d.photoUrl=uploaded[0]?.url||'';drafts[k].photoUrl=d.photoUrl;}t.textContent='기록 저장 중…';const r=await KCA_AUTH.rpc('saveReport',d);drafts[k].savedId=r.id;dirty=false;try{localStorage.setItem('kca-profile',JSON.stringify({inspector:d.inspector,department:d.department}));}catch{}t.textContent='저장 완료 · '+r.id;b.textContent='저장 완료';A().toast('기록을 저장했습니다.');const p=document.createElement('div');p.className='saved-panel';p.innerHTML=`<h2>기록을 남겼습니다.</h2><p>${A().esc(r.id)}</p><button class="outline-btn" id="newReport">새 기록</button> <button class="outline-btn" id="seeSaved">작성 내용 보기</button>`;if(!$('#reportForm')||A().state.route!==k)return;$('#reportForm').after(p);$('#newReport').onclick=()=>{drafts[k]=blank(k);render(k);};$('#seeSaved').onclick=()=>preview(k);}catch(e){t.textContent=e.message;b.disabled=false;}}
 function reportHtml(d){if(d.kind==='작업중지권')return stopSheet(d,false);return `<h2>${A().esc(d.kind)} 보고서</h2><table class="report-table"><tr><th>소속·검사관</th><td>${A().esc(d.department)} / ${A().esc(d.inspector)}</td></tr><tr><th>일시</th><td>${A().esc(d.when?.replace('T',' '))} (한국 시간)</td></tr><tr><th>현장</th><td>${A().esc(d.address)} ${A().esc(d.place)}</td></tr><tr><th>유형·결과</th><td>${A().esc(S().sites[d.site]?.name)} / ${A().esc(d.decision)}</td></tr>${d.actionSchemaVersion===3?'':`<tr><th>상세 사유</th><td class="prewrap">${A().esc(d.reason)}</td></tr>`}<tr><th>${d.actionSchemaVersion===3?'위험·조치 기록':'조치'}</th><td class="prewrap">${A().esc(d.action)}${Number(d.actionSchemaVersion)>=2&&d.result==='risk'?'<br><small>작성자가 실제 조치·진행 상태 확인</small>':''}</td></tr>${d.recommendedAction?`<tr><th>현장 조치안</th><td class="prewrap">${A().esc(d.recommendedAction)}<br><small>자동 초안 · 현장 확인용</small></td></tr>`:''}${(d.weather||['feelsLike','temperature','gust','wind','rainHourly','snowHourly','snowDepth'].some(k=>d[k]!==''&&d[k]!==undefined&&d[k]!==null))?`<tr><th>기상 참고 기록</th><td class="prewrap">${A().esc(weatherRecord(d))}</td></tr>`:''}<tr><th>담당관 보고</th><td>${d.notified?'직접 보고함':'미확인'}</td></tr></table><p class="detail-note">간편 확인 기록입니다. 개별 12개 항목의 적합 여부는 자동 입력하지 않았습니다.</p>${d.photoUrl?A().link(d.photoUrl,'참고 자료 열기 ↗'):''}<p class="detail-meta">${A().esc(S().source)} (${A().esc(d.manualVersion)}) · 운영 KCA 부산본부</p>`;}
 function preview(k){capture(k);const d=finalized(drafts[k]);A().showDialog('작성 내용',reportHtml(d)+`<p class="detail-meta">${d.savedId?'저장 완료 · '+A().esc(d.savedId):'미저장 초안'}</p><button class="outline-btn" id="draftFile">초안 파일 보관</button> <button class="outline-btn" id="printDraft">인쇄·PDF로 보관</button>`);loadPhotos(d).catch(()=>A().toast('사진을 불러오지 못했습니다.'));$('#draftFile').onclick=()=>download(d);$('#printDraft').onclick=()=>print(d);}
 function download(d){const u=URL.createObjectURL(new Blob([JSON.stringify({...d,storageState:d.savedId?'cloud-saved':'unsaved-draft'},null,2)],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='KCA_'+d.kind+'_'+d.when.slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
 async function print(d){const w=window.open('','_blank');if(!w){A().toast('인쇄 창을 열 수 없습니다.');return;}try{await loadPhotos(d);}catch{w.close();A().toast('사진을 불러오지 못했습니다. 다시 확인해 주세요.');return;}w.document.write(`<!doctype html><html lang="ko"><meta charset="utf-8"><title>KCA 보고서</title><style>${stopStyles()}body{font:12px system-ui;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #aaa;padding:10px;text-align:left}.prewrap{white-space:pre-wrap}@media print{button{display:none}@page{size:A4;margin:15mm}}</style><button onclick="print()">인쇄 / PDF로 저장</button>${reportHtml(d)}<p>${d.savedId?'저장 완료 · '+A().esc(d.savedId):'미저장 초안'}</p></html>`);w.document.close();}
 window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});window.KCA_REPORTS={render,reportHtml,drafts,inferRegion,finalized,stopSheet,print,loadPhotos};
})();





</script><script>(() => {
  'use strict';
  let adminToken='',adminExpiry=0,credential='',credentialExpiry=0,session=null,sdkPromise=null,loginPromise=null;
  const A=()=>KCA_APP, $=s=>document.querySelector(s);
  function sdk(){return sdkPromise||(sdkPromise=new Promise((resolve,reject)=>{if(window.google?.accounts?.id){resolve();return;}const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=resolve;s.onerror=()=>{sdkPromise=null;reject(Error('Google 로그인 화면을 불러오지 못했습니다.'));};document.head.append(s);}));}
  function configured(){return A().apiUrl()&&KCA_CONFIG.googleClientId;}
  async function ensureLogin(){if(adminToken&&session&&adminExpiry>Date.now()+30000)return session;adminToken='';adminExpiry=0;if(credential&&session&&credentialExpiry>Date.now()+30000&&(session.role!=='reader'||window.KCA_READER?.enabled))return session;if(loginPromise)return loginPromise;credential='';credentialExpiry=0;session=null;if(!configured())throw Error('Google 저장·로그인 연결 전입니다. 연결·운영 안내에서 최초 설정을 완료해 주세요.');if(loginPromise)return loginPromise;
    loginPromise=new Promise(async(resolve,reject)=>{let dialog=$('#loginDialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='loginDialog';document.body.append(dialog);}dialog.innerHTML='<div class="dialog-top"><span class="eyebrow">STAFF SIGN IN</span><button class="close" id="closeLogin" aria-label="로그인 창 닫기">×</button></div><h2>포털 로그인</h2><p>등록된 직원은 보고 기록과 교육자료를, 관리자는 편집 기능을 이용할 수 있습니다.</p><div id="googleButton"></div><details class="local-login"><summary>관리자 아이디로 로그인</summary><form id="localAdminForm"><label>관리자 아이디<input name="username" required minlength="3" maxlength="40" autocomplete="username" autocapitalize="none"></label><label>관리자 비밀번호<input name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"></label><button type="submit" class="save-report">관리자 로그인</button><p id="localLoginStatus" role="status"></p></form></details><p id="loginFeedback" role="status"></p>';if(A().state.route==='admin')dialog.querySelector('.local-login').open=true;dialog.showModal();let settled=false;const finish=(err,s)=>{if(settled)return;settled=true;loginPromise=null;window.google?.accounts?.id?.cancel();dialog.close();err?reject(err):resolve(s);};$('#closeLogin').onclick=()=>finish(Error('로그인을 취소했습니다.'));dialog.oncancel=()=>finish(Error('로그인을 취소했습니다.'));
      $('#localAdminForm').onsubmit=async event=>{event.preventDefault();const f=event.target,b=f.querySelector('[type=submit]');b.disabled=true;$('#localLoginStatus').textContent='관리자 로그인을 확인합니다…';try{const r=await rpc('loginAdmin',{username:f.elements.username.value,password:f.elements.password.value});f.elements.password.value='';if(settled)return;adminToken=r.token;adminExpiry=r.expiresAt;session=warmSession(r.session);finish(null,session);}catch(e){$('#localLoginStatus').textContent=e.message;b.disabled=false;}};

  }
  function adminLoginSettings(){A().showDialog('관리자 아이디·비밀번호 설정',`<p>기존 관리자 권한에 연결합니다. 열람용 비밀번호와 별도로 사용하고, Google 로그인도 계속 이용할 수 있습니다.</p><form id="adminLoginSettings" class="local-login"><label>관리자 아이디<input name="username" required pattern="[A-Za-z0-9_-]{3,40}" minlength="3" maxlength="40" autocomplete="username" placeholder="영문·숫자 3자 이상"></label><label>새 관리자 비밀번호<input name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="8자 이상"></label><label>비밀번호 확인<input name="confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></label><button type="submit" class="save-report">관리자 로그인 설정 저장</button><p id="adminLoginSettingsStatus" role="status"></p></form>`);$('#adminLoginSettings').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('[type=submit]');if(f.elements.password.value!==f.elements.confirm.value){$('#adminLoginSettingsStatus').textContent='비밀번호 확인을 같게 입력하세요.';return;}b.disabled=true;$('#adminLoginSettingsStatus').textContent='저장 중…';try{await rpc('setAdminLogin',Object.fromEntries(new FormData(f)));f.elements.password.value='';f.elements.confirm.value='';$('#detail').close();A().toast('관리자 아이디 로그인을 설정했습니다. Google 로그인도 계속 이용할 수 있습니다.');}catch(err){$('#adminLoginSettingsStatus').textContent=err.message;b.disabled=false;}};}
  function field(name,label,value='',type='text',required=false){return `<label>${label}<input name="${name}" type="${type}" value="${A().esc(value)}" ${required?'required':''}></label>`;}
  function select(name,label,items,value){return `<label>${label}<select name="${name}">${items.map(([v,t])=>`<option value="${A().esc(v)}" ${value===v?'selected':''}>${A().esc(t)}</option>`).join('')}</select></label>`;}
  function editEntity(kind,old,demo){const o=old||{id:kind==='settings'?'portal':'c_'+crypto.randomUUID().replaceAll('-',''),revision:0,order:10,active:true,visibility:'staff',status:'draft',format:'article'},d=adminData;let fields='';
    if(kind==='contents'){fields=field('title','제목',o.title,'text',true)+select('categoryId','카테고리',d.categories.filter(c=>c.active!==false).map(c=>[c.id,c.name]),o.categoryId)+field('summary','요약',o.summary)+select('format','자료형식',Object.entries(A().formats),o.format)+select('campaignId','관련 캠페인',[['','연결 없음'],...d.campaigns.map(c=>[c.id,c.title])],o.campaignId)+select('visibility','열람 범위',[['public','공개'],['password','열람 비밀번호'],['staff','허용 계정 전용']],o.visibility)+select('status','게시 상태',[['draft','임시저장'],['published','게시'],['archived','보관·노출중단']],o.status)+field('date','자료일자 · YYYY-MM 또는 YYYY-MM-DD',o.date)+field('duration','교육시간 표시',o.duration)+field('url','원본 링크 · 영상은 Drive',o.url,'url')+field('thumbnail','썸네일 이미지 링크 (선택)',o.thumbnail,'url')+`<label class="full">본문<textarea name="body" rows="7" maxlength="8000">${A().esc(o.body)}</textarea></label><label class="full">추가 자료 링크 · 한 줄에 이름 | URL | 형식<textarea name="attachments" rows="4" placeholder="요약 PDF | https://drive.google.com/... | pdf">${A().esc((o.attachments||[]).map(a=>[a.label,a.url,a.format].join(' | ')).join('\n'))}</textarea></label>`;}
    if(kind==='categories')fields=field('name','카테고리 이름',o.name,'text',true)+select('parentId','상위 카테고리',[['','최상위'],...d.categories.filter(c=>c.id!==o.id).map(c=>[c.id,c.name])],o.parentId)+field('order','노출 순서',o.order,'number')+select('active','사용 여부',[['true','사용'],['false','비활성']],String(o.active!==false));
    if(kind==='campaigns')fields=field('title','캠페인 제목',o.title,'text',true)+field('month','캠페인 월',o.month,'month',true)+field('summary','캠페인 설명',o.summary)+select('visibility','열람 범위',[['public','공개'],['password','열람 비밀번호'],['staff','허용 계정 전용']],o.visibility)+select('status','게시 상태',[['draft','임시저장'],['published','게시'],['archived','보관']],o.status)+field('order','노출 순서',o.order,'number');
    if(kind==='members')fields=field('email','허용할 Google 계정 이메일',o.email,'email',true)+select('role','역할',[['staff','직원'],['admin','관리자']],o.role)+select('active','사용 여부',[['true','사용'],['false','사용 중지']],String(o.active!==false));
    if(kind==='settings')fields='<p class="full">운영부서 · KCA 부산본부</p>'+field('intro','포털 소개',o.intro)+field('notice','첫 화면 안내',o.notice)+select('featuredCampaignId','대표 캠페인',[['','자동 선택'],...d.campaigns.filter(c=>c.visibility==='public').map(c=>[c.id,c.title])],o.featuredCampaignId);
    A().showDialog((old?'수정':'새 항목 등록')+' · '+labels[kind],`<form id="entityForm"><div class="form-grid">${fields}<label class="full">등록·수정 사유<input name="changeReason" required maxlength="250" placeholder="예: 매뉴얼 개정 반영, 링크 정정, 월간 자료 등록"></label></div><p class="form-hint">${demo?'편집 구성 예시입니다. 실제 저장은 Google 연결 후 가능합니다.':'저장하면 Google Sheets에 기록하고 이전 버전을 수정 이력으로 보관합니다.'}</p><button type="submit" class="save-report">${demo?'Google 연결 후 저장 가능':'내용 저장'}</button><p id="entityStatus" role="status"></p></form>`);
    const f=$('#entityForm');if(kind==='contents')f.elements.format.onchange=()=>{if(!f.elements.visibility.value)f.elements.visibility.value='password';};f.onsubmit=async e=>{e.preventDefault();if(!f.reportValidity())return;const t=$('#entityStatus');if(demo){t.textContent='저장되지 않았습니다. 실제 Google 저장소 연결 후 사용하세요.';return;}const values=Object.fromEntries(new FormData(f)),item={...o,...values};delete item.changeReason;for(const k of ['order','revision'])if(item[k]!==undefined)item[k]=Number(item[k]);if(item.active!==undefined)item.active=item.active==='true'||item.active===true;if(kind==='members')item.id=item.email.toLowerCase();if(kind==='contents'){try{item.attachments=values.attachments.split('\n').filter(x=>x.trim()).map(line=>{const p=line.split('|').map(s=>s.trim());if(p.length!==3||!A().safeUrl(p[1]))throw Error('추가 자료의 이름 | HTTPS 링크 | 형식을 확인하세요.');return {label:p[0],url:p[1],format:p[2]};});}catch(err){t.textContent=err.message;return;}}const b=f.querySelector('[type=submit]');b.disabled=true;t.textContent='Google 저장소에 저장 중…';try{await rpc('saveEntity',{kind,item,reason:values.changeReason});$('#detail').close();await render('admin');A().load();A().toast('저장 완료 · 수정 이력을 보관했습니다.');}catch(err){t.textContent=err.message;b.disabled=false;}};
  }
  function downloadJson(obj,name){download(new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),name+'_'+new Date().toISOString().slice(0,10)+'.json');}
  function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
  function exportCsv(rows){const headers=['기록번호','종류','소속','검사관','일시(한국)','시도','주소','상세위치','현장유형','판단','위험요인','사유','조치','담당관직접보고','사진링크',...KCA_SAFETY.checks];const keys=['recordNo','kind','department','inspector','when','region','address','place','site','decision','risks','reason','action','notified','photoUrl'];const cell=s=>{s=String(s??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const lines=[headers,...rows.map(r=>[...keys.map(k=>Array.isArray(r[k])?r[k].join(', '):r[k]),...KCA_SAFETY.checks.map((_,i)=>r.checks?.[i]||'')])].map(r=>r.map(cell).join(','));download(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),'KCA_안전기록.csv');}
  function importContent(demo){A().showDialog('자료 목록 일괄 등록','<p>파일명·분류·형식·Drive 링크를 담은 JSON 목록을 붙여넣으세요. 최대 100건이며 이미 등록된 파일과 첨부는 건너뜁니다. 원본 공유 권한은 바꾸지 않습니다.</p><textarea id="importJson" rows="10" style="width:100%" aria-label="신규 콘텐츠 JSON"></textarea><button id="runImport" class="save-report">자료 목록 등록</button><p id="importStatus" role="status"></p>');$('#runImport').onclick=async()=>{const t=$('#importStatus');if(demo){t.textContent='실제 저장 연결 전입니다.';return;}let items;try{items=JSON.parse($('#importJson').value);if(!Array.isArray(items)||!items.length||items.length>100)throw Error('1~100개의 자료 목록을 입력하세요.');}catch(e){t.textContent=e.message;return;}$('#runImport').disabled=true;t.textContent=items.length+'개 자료를 확인하고 등록합니다…';try{const result=await rpc('importContents',{items:items.map(i=>({summary:'',body:'',campaignId:'',url:'',thumbnail:'',date:'',duration:'',attachments:[],order:10,status:'published',visibility:'public',format:'article',...i,id:i.id||'c_'+crypto.randomUUID().replaceAll('-',''),revision:0}))});staffData=null;staffLoadedAt=0;A().invalidateCatalog();t.textContent=result.added.length+'건 등록 · '+result.skipped.length+'건 기존 자료 제외'+(result.failed.length?' · 실패: '+result.failed[0].error+' · 나머지 '+result.remaining+'건 미등록':'');A().load();}catch(e){t.textContent=e.message+' 같은 목록으로 다시 시도하면 이미 저장한 파일은 건너뜁니다.';}$('#runImport').disabled=false;};}
  async function catalog(force=false){await ensureLogin();if(force||!staffData||Date.now()-staffLoadedAt>60000){staffData=await rpc('staffData',{});staffLoadedAt=Date.now();}return staffData;}
  window.KCA_MANAGEMENT={render,catalog,quickRegister};
})();




</script><script>/* 관리자용 표 편집. 저장 전에는 초안만 바꾸고, 삭제는 보관함으로 이동합니다. */
(() => {
 'use strict';const A=()=>KCA_APP,$=s=>document.querySelector(s),edits=new Map();
 function render(data,kind,demo,reload){const rows=data[kind]||[],e=A().esc,fields=kind==='contents'?['title','categoryId','format','date','visibility','status','blind']:kind==='categories'?['name','parentId','active']:['title','month','visibility','status'];
  edits.clear();
  const original=new Map(rows.map(r=>[r.id,r])),draft=new Map(rows.map(r=>[r.id,{...r}])),selected=new Set();let archived=false,query='';const host=$('#adminPanel');
  const linked=id=>(data.contents||[]).filter(c=>c.categoryId===id).length;
  const option=(v,t,chosen)=>`<option value="${e(v)}" ${String(chosen)===String(v)?'selected':''}>${e(t)}</option>`;
  const input=(id,key,value,type='text')=>`<input data-bulk-id="${e(id)}" data-field="${key}" value="${e(value)}" type="${type}" aria-label="${e(original.get(id)?.title||original.get(id)?.name)} ${key==='date'?'자료일자':key==='title'||key==='name'?'이름':key==='month'?'캠페인 월':key}" maxlength="${key==='date'?10:180}" ${key==='date'?'placeholder="YYYY-MM 또는 YYYY-MM-DD"':''}>`;
  const select=(id,key,choices,value)=>`<select data-bulk-id="${e(id)}" data-field="${key}" aria-label="${e(original.get(id)?.title||original.get(id)?.name)} ${key==='visibility'?'열람 단계':key==='categoryId'?'분류':key==='format'?'자료형식':'상태'}">${choices.map(([v,t])=>option(v,t,value)).join('')}</select>`;
  const vis=[['public','공개'],['password','비밀번호'],['staff','허용 계정']],statuses=[['published','게시'],['draft','임시저장'],['archived','보관함']],activeCats=(data.categories||[]).filter(c=>c.active!==false).sort((a,b)=>Number(a.order)-Number(b.order));
  const visible=()=>[...draft.values()].filter(r=>(kind==='categories'?(r.active===false)===archived:(r.status==='archived')===archived)&&[r.title,r.name,r.summary].join(' ').toLowerCase().includes(query.toLowerCase()));
  const changed=()=>[...draft.values()].filter(r=>fields.some(k=>String(r[k]??'')!==String(original.get(r.id)?.[k]??'')));
  function patches(){return changed().map(r=>{const old=original.get(r.id),p={id:r.id,revision:old.revision};fields.forEach(k=>{if(String(r[k]??'')!==String(old[k]??''))p[k]=r[k];});if(p.date!==undefined)p.dateBasis='관리자 지정';return p;});}
  function row(r){let cells='';if(kind==='contents'){const cats=activeCats.map(c=>[c.id,c.name]);if(!cats.some(c=>c[0]===r.categoryId))cats.unshift([r.categoryId,'[비활성 분류] 변경해 주세요']);cells=`<td>${input(r.id,'title',r.title)}<button class="bulk-detail" data-bulk-detail="${e(r.id)}">본문·원본 링크 수정</button></td><td>${select(r.id,'categoryId',cats,r.categoryId)}</td><td>${select(r.id,'format',Object.entries(A().formats),r.format)}</td><td>${input(r.id,'date',r.date||'')}<small>${e(r.dateBasis||'')}</small></td><td>${select(r.id,'visibility',vis,r.visibility)}${kind==='contents'?`<label class="blind-option"><input type="checkbox" data-bulk-id="${e(r.id)}" data-field="blind" ${r.blind?'checked':''}> 제목 숨김</label>`:''}</td><td>${select(r.id,'status',statuses,r.status)}</td>`;}else if(kind==='categories'){cells=`<td>${input(r.id,'name',r.name)}</td><td>${select(r.id,'parentId',[['','최상위'],...activeCats.filter(c=>c.id!==r.id).map(c=>[c.id,c.name])],r.parentId||'')}</td><td>${linked(r.id)}건</td><td>${select(r.id,'active',[['true','사용'],['false','보관함']],r.active!==false)}</td>`;}else cells=`<td>${input(r.id,'title',r.title)}<button class="bulk-detail" data-bulk-detail="${e(r.id)}">본문·원본 링크 수정</button></td><td>${input(r.id,'month',r.month,'month')}</td><td>${select(r.id,'visibility',vis,r.visibility)}${kind==='contents'?`<label class="blind-option"><input type="checkbox" data-bulk-id="${e(r.id)}" data-field="blind" ${r.blind?'checked':''}> 제목 숨김</label>`:''}</td><td>${select(r.id,'status',statuses,r.status)}</td>`;return `<tr class="${fields.some(k=>String(r[k]??'')!==String(original.get(r.id)?.[k]??''))?'edited':''}"><td><input type="checkbox" data-select-row="${e(r.id)}" aria-label="${e(r.title||r.name)} 선택" ${selected.has(r.id)?'checked':''}></td>${cells}</tr>`;}
  host.innerHTML=`<div class="bulk-top"><p>표에서 여러 항목을 바꾸고 <b>한 번에 저장</b>하세요. 삭제한 항목은 보관함에서 복원할 수 있습니다.</p><label class="bulk-archive"><input type="checkbox" id="showArchived"> 보관함 보기</label><input type="search" id="bulkSearch" aria-label="관리 항목 검색" placeholder="항목 검색"></div><div class="bulk-tools"><span id="bulkSelected">선택 0건</span>${kind==='contents'?`<select id="bulkCategory" aria-label="선택 자료의 분류"><option value="">분류 유지</option>${activeCats.map(c=>option(c.id,c.name,'')).join('')}</select><select id="bulkVisibility" aria-label="선택 자료의 열람 단계"><option value="">열람 단계 유지</option>${vis.map(([v,t])=>option(v,t,'')).join('')}</select><input id="bulkDate" aria-label="선택 자료의 일자" placeholder="자료일자 · YYYY-MM-DD" maxlength="10"><button id="applyBulk" class="outline-btn">선택 항목에 적용</button>`:''}<button id="archiveBulk" class="outline-btn">선택 삭제</button><button id="restoreBulk" class="outline-btn" hidden>선택 복원</button></div><div class="table-scroll"><table class="admin-table bulk-table"><thead><tr><th><input type="checkbox" id="selectAllBulk" aria-label="보이는 항목 전체 선택"></th>${(kind==='contents'?['제목','분류','자료형식','자료일자','열람 단계','상태']:kind==='categories'?['분류 이름','상위 분류','연결 자료','상태']:['캠페인 제목','월','열람 단계','상태']).map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody id="bulkRows"></tbody></table></div><div class="bulk-save"><strong id="bulkChanged">변경 0건</strong><button id="saveBulk" class="primary" disabled>변경 내용 한 번에 저장</button><button id="resetBulk" class="outline-btn">변경 취소</button><span id="bulkStatus" role="status"></span></div>${kind==='contents'?'<p class="form-hint">파일 원본은 삭제하지 않습니다. 자료일자는 확인된 월(YYYY-MM) 또는 날짜로 지정할 수 있습니다.</p><button class="outline-btn" id="importContent">콘텐츠 JSON 일괄 등록</button>':''}`;
  function controls(){const n=changed().length;$('#bulkChanged').textContent='변경 '+n+'건';$('#bulkSelected').textContent='선택 '+selected.size+'건';$('#saveBulk').disabled=!n;$('#archiveBulk').hidden=archived;$('#restoreBulk').hidden=!archived;$('#selectAllBulk').checked=visible().length>0&&visible().every(r=>selected.has(r.id));edits.set(kind,n);}
  function draw(){const a=visible().sort((a,b)=>kind==='contents'?String(b.date||'').localeCompare(String(a.date||'')):kind==='campaigns'?String(b.month||'').localeCompare(String(a.month||'')):Number(a.order||0)-Number(b.order||0));$('#bulkRows').innerHTML=a.map(row).join('')||`<tr><td colspan="7">${archived?'보관한 항목이 없습니다.':'조건에 맞는 항목이 없습니다.'}</td></tr>`;controls();}
  host.oninput=event=>{const t=event.target;if(!t.dataset.bulkId)return;const r=draft.get(t.dataset.bulkId),key=t.dataset.field;r[key]=key==='blind'?t.checked:key==='active'?t.value==='true':t.value;t.closest('tr').classList.toggle('edited',fields.some(k=>String(r[k]??'')!==String(original.get(r.id)?.[k]??'')));controls();};
  host.onchange=event=>{const t=event.target;if(t.dataset.selectRow){t.checked?selected.add(t.dataset.selectRow):selected.delete(t.dataset.selectRow);controls();}};
  $('#selectAllBulk').onchange=e=>{visible().forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));draw();};$('#bulkSearch').oninput=e=>{query=e.target.value;draw();};$('#showArchived').onchange=e=>{archived=e.target.checked;selected.clear();draw();};
  if($('#applyBulk'))$('#applyBulk').onclick=()=>{if(!selected.size){A().toast('조정할 항목을 선택하세요.');return;}for(const id of selected){const r=draft.get(id);if($('#bulkCategory').value)r.categoryId=$('#bulkCategory').value;if($('#bulkVisibility').value)r.visibility=$('#bulkVisibility').value;if($('#bulkDate').value)r.date=$('#bulkDate').value;}draw();};
  function archive(flag){if(!selected.size){A().toast('항목을 선택하세요.');return;}for(const id of selected){const r=draft.get(id);if(kind==='categories')r.active=!flag;else r.status=flag?'archived':'published';}selected.clear();draw();$('#bulkStatus').textContent='저장하면 '+(flag?'보관함으로 이동합니다.':'복원합니다.');}
  $('#archiveBulk').onclick=()=>archive(true);$('#restoreBulk').onclick=()=>archive(false);$('#resetBulk').onclick=()=>{edits.set(kind,0);render(data,kind,demo,reload);};
  async function submit(targetCategoryId=''){const items=patches();if(demo){$('#bulkStatus').textContent='구성 예시 · 실제 저장 연결 전입니다.';return;}const b=$('#saveBulk');b.disabled=true;$('#bulkStatus').textContent=items.length+'건 저장 중…';try{const result=await KCA_AUTH.rpc('batchUpdateEntities',{kind,items,targetCategoryId});if(result.failed?.length){$('#bulkStatus').textContent=result.updated.length+'건 저장 · '+result.failed[0].error+' · 나머지 '+result.remaining+'건 미저장';b.disabled=false;return;}edits.set(kind,0);A().invalidateCatalog();A().toast(result.updated.length+'건 저장했습니다.');await reload();A().load();}catch(err){$('#bulkStatus').textContent=err.message;b.disabled=false;}}
  $('#saveBulk').onclick=()=>{const removing=kind==='categories'?changed().filter(c=>c.active===false&&original.get(c.id).active!==false):[],count=removing.reduce((n,c)=>n+linked(c.id),0);if(!count){submit();return;}const ids=new Set(removing.map(c=>c.id)),targets=activeCats.filter(c=>!ids.has(c.id));A().showDialog('분류 삭제 · 자료는 유지합니다',`<p>연결된 자료 ${count}건을 옮길 분류를 선택하세요. 원본 파일과 자료는 삭제하지 않습니다.</p><form id="moveDeletedCategories"><label class="block-label">자료를 옮길 분류<select name="target" required><option value="">선택</option>${targets.map(c=>option(c.id,c.name,'')).join('')}</select></label><button class="save-report" type="submit">분류 정리·저장</button></form>`);$('#moveDeletedCategories').onsubmit=e=>{e.preventDefault();const id=e.target.elements.target.value;$('#detail').close();submit(id);};};
  host.onclick=event=>{const b=event.target.closest('[data-bulk-detail]');if(b){if(changed().length){A().toast('표 변경을 먼저 저장하거나 취소해 주세요.');return;}window.KCA_MANAGEMENT.quickRegister(original.get(b.dataset.bulkDetail));}};
  draw();
 }
 window.addEventListener('beforeunload',e=>{if([...edits.values()].some(n=>n>0)){e.preventDefault();e.returnValue='';}});
 window.KCA_BULK={render,hasChanges:()=>[...edits.values()].some(n=>n>0),discard:()=>edits.clear()};
})();
</script></body>
</html>
