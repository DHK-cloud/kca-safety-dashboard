 function reportHtml(d){return `<h2>${A().esc(d.kind)} 보고서</h2><table class="report-table"><tr><th>소속·검사관</th><td>${A().esc(d.department)} / ${A().esc(d.inspector)}</td></tr><tr><th>일시</th><td>${A().esc(d.when?.replace('T',' '))} (한국 시간)</td></tr><tr><th>현장</th><td>${A().esc(d.address)} ${A().esc(d.place)}</td></tr><tr><th>유형·결과</th><td>${A().esc(S().sites[d.site]?.name)} / ${A().esc(d.decision)}</td></tr><tr><th>상세 사유</th><td class="prewrap">${A().esc(d.reason)}</td></tr><tr><th>조치</th><td>${A().esc(d.action)}</td></tr><tr><th>담당관 보고</th><td>${d.notified?'직접 보고함':'미확인'}</td></tr></table><p class="detail-note">간편 확인 기록입니다. 개별 12개 항목의 적합 여부는 자동 입력하지 않았습니다.</p>${d.photoUrl?A().link(d.photoUrl,'참고 자료 열기 ↗'):''}<p class="detail-meta">${A().esc(S().source)} (${A().esc(d.manualVersion)}) · 운영 KCA 부산본부</p>`;}
 function preview(k){capture(k);const d=finalized(drafts[k]);A().showDialog('작성 내용',reportHtml(d)+`<p class="detail-meta">${d.savedId?'저장 완료 · '+A().esc(d.savedId):'미저장 초안'}</p><button class="outline-btn" id="draftFile">초안 파일 보관</button> <button class="outline-btn" id="printDraft">인쇄·PDF로 보관</button>`);$('#draftFile').onclick=()=>download(d);$('#printDraft').onclick=()=>print(d);}
 function download(d){const u=URL.createObjectURL(new Blob([JSON.stringify({...d,storageState:d.savedId?'cloud-saved':'unsaved-draft'},null,2)],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='KCA_'+d.kind+'_'+d.when.slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
 function print(d){const w=window.open('','_blank');if(!w){A().toast('인쇄 창을 열 수 없습니다.');return;}w.document.write(`<!doctype html><html lang="ko"><meta charset="utf-8"><title>KCA 보고서</title><style>body{font:12px system-ui;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #aaa;padding:10px;text-align:left}.prewrap{white-space:pre-wrap}@media print{button{display:none}@page{size:A4;margin:15mm}}</style><button onclick="print()">인쇄 / PDF로 저장</button>${reportHtml(d)}<p>${d.savedId?'저장 완료 · '+A().esc(d.savedId):'미저장 초안'}</p></html>`);w.document.close();}
 window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});window.KCA_REPORTS={render,reportHtml,drafts,inferRegion,finalized};
})();
</script><script>(() => {
  'use strict';
  let credential='',credentialExpiry=0,session=null,sdkPromise=null,loginPromise=null;
  const A=()=>KCA_APP, $=s=>document.querySelector(s);
  function sdk(){return sdkPromise||(sdkPromise=new Promise((resolve,reject)=>{if(window.google?.accounts?.id){resolve();return;}const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=resolve;s.onerror=()=>{sdkPromise=null;reject(Error('Google 로그인 화면을 불러오지 못했습니다.'));};document.head.append(s);}));}
  function configured(){return A().apiUrl()&&KCA_CONFIG.googleClientId;}
  async function ensureLogin(){if(credential&&session&&credentialExpiry>Date.now()+30000)return session;if(loginPromise)return loginPromise;credential='';credentialExpiry=0;session=null;if(!configured())throw Error('Google 저장·로그인 연결 전입니다. 연결·운영 안내에서 최초 설정을 완료해 주세요.');if(loginPromise)return loginPromise;
    loginPromise=new Promise(async(resolve,reject)=>{let dialog=$('#loginDialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='loginDialog';document.body.append(dialog);}dialog.innerHTML='<div class="dialog-top"><span class="eyebrow">STAFF SIGN IN</span><button class="close" id="closeLogin" aria-label="로그인 창 닫기">×</button></div><h2>Google 계정으로 로그인</h2><p>등록된 직원은 보고 기록과 교육자료를, 관리자는 편집 기능을 이용할 수 있습니다.</p><div id="googleButton"></div><p id="loginFeedback" role="status"></p>';dialog.showModal();let settled=false;const finish=(err,s)=>{if(settled)return;settled=true;loginPromise=null;window.google?.accounts?.id?.cancel();dialog.close();err?reject(err):resolve(s);};$('#closeLogin').onclick=()=>finish(Error('로그인을 취소했습니다.'));dialog.oncancel=()=>finish(Error('로그인을 취소했습니다.'));
      try{await sdk();const nonce=crypto.randomUUID();google.accounts.id.initialize({client_id:KCA_CONFIG.googleClientId,nonce:nonce,auto_select:true,callback:async result=>{if(settled)return;try{const p=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(result.credential.split('.')[1].replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0))));if(p.nonce!==nonce)throw Error('로그인 요청이 일치하지 않습니다.');credential=result.credential;credentialExpiry=Number(p.exp||0)*1000;session=await rpc('session',{});if(settled){credential='';credentialExpiry=0;session=null;return;}finish(null,session);}catch(e){credential='';session=null;$('#loginFeedback').textContent=e.message;}}});google.accounts.id.renderButton($('#googleButton'),{theme:'outline',size:'large',text:'signin_with',locale:'ko'});google.accounts.id.prompt();}catch(e){finish(e);}});return loginPromise;
  }
  function rpc(action,data){return new Promise((resolve,reject)=>{const url=A().apiUrl();if(!url||!credential){reject(Error('Google 로그인 후 다시 시도하세요.'));return;}const nonce=crypto.randomUUID(),name='kca_rpc_'+nonce.replaceAll('-',''),frame=document.createElement('iframe'),form=document.createElement('form'),payload=document.createElement('textarea');frame.name=name;frame.hidden=true;frame.title='Google 기록 저장 응답';form.method='POST';form.action=url;form.target=name;form.hidden=true;payload.name='payload';payload.value=JSON.stringify({nonce,origin:location.origin,action,data,credential});form.append(payload);document.body.append(frame,form);let timer;const finish=(err,result)=>{clearTimeout(timer);window.removeEventListener('message',receive);form.remove();frame.remove();err?reject(err):resolve(result);};const receive=e=>{let host;try{host=new URL(e.origin).hostname;}catch{return;}if(host!=='script.google.com'&&!host.endsWith('.googleusercontent.com'))return;if(e.data?.type!=='KCA_RPC_RESULT'||e.data.nonce!==nonce)return;const result=e.data.result;if(result?.ok)finish(null,result.data);else{if(/로그인|서명|인증키/.test(result?.error||'')){credential='';session=null;}finish(Error(result?.error||'저장 결과를 확인하지 못했습니다.'));}};window.addEventListener('message',receive);timer=setTimeout(()=>finish(Error('저장 결과를 확인하지 못했습니다. 연결을 확인한 뒤 다시 시도하세요. 보고 기록은 같은 번호로 재시도해 중복을 방지합니다.')),25000);form.submit();});}
  function logout(){credential='';credentialExpiry=0;session=null;window.google?.accounts?.id?.disableAutoSelect();adminData=null;render(location.hash.slice(1));}
  window.KCA_AUTH={ensureLogin,rpc,logout,get session(){return session;},configured};
  let adminData=null,tab='contents',staffData=null;
  const labels={contents:'콘텐츠',categories:'카테고리',campaigns:'캠페인',reports:'보고 기록',history:'수정 이력',members:'허용 계정',settings:'포털 설정'};
  function connectionScreen(route){$('#main').innerHTML=`<div class="page-title"><span class="eyebrow">${route==='admin'?'CONTENT MANAGEMENT':'STAFF LEARNING'}</span><h1>${route==='admin'?'관리자 편집':route==='records'?'내 보고 기록':route==='campaign'?'월간 안전캠페인':'교육·자료'}</h1><p>Google 계정 권한을 확인하고 이용합니다.</p></div><div class="empty"><h3>${configured()?'허용된 Google 계정으로 로그인하세요.':'Google 연결을 준비하고 있습니다.'}</h3><p>${configured()?'교육영상은 Drive에서 재생합니다. 기록과 수정 내용은 클라우드에 보관됩니다.':'실제 자료와 계정 연결 전입니다. 편집 화면의 구성은 미리 확인할 수 있습니다.'}</p>${configured()?'<button id="loginPage" class="save-report">Google 로그인</button>':'<a class="primary" href="portal-guide.html" target="_blank" rel="noopener">연결·운영 안내 ↗</a>'}${route==='admin'&&!configured()?'<button id="previewAdmin">관리자 화면 구성 보기</button>':''}</div>`;if($('#previewAdmin'))$('#previewAdmin').onclick=()=>{const d=A().state.data;adminData={contents:d.contents,categories:d.categories,campaigns:d.campaigns,settings:[{id:'portal',...d.settings,revision:0}],members:[],reports:[],history:[]};adminRender(true);};if($('#loginPage'))$('#loginPage').onclick=async()=>{try{await ensureLogin();render(route);}catch(e){A().toast(e.message);}};}
  async function render(route){if(!session){connectionScreen(route);return;}$('#main').innerHTML='<div class="page-title"><h1>자료를 불러오고 있습니다.</h1></div>';try{if(route==='admin'){if(session.role!=='admin')throw Error('관리자 계정으로 로그인해 주세요.');adminData=await rpc('adminData',{});adminRender(false);}else if(route==='records'){const records=await rpc('myReports',{});$('#main').innerHTML=`<div class="page-title"><span class="eyebrow">MY REPORTS</span><h1>내 보고 기록</h1><p>${A().esc(session.email)} · 최근 300건</p></div>${reportTable(records)}`;bindReportView(records);}else{staffData=await rpc('staffData',{});staffData.contents=[...new Map([...(A().state.data.contents||[]),...staffData.contents].map(c=>[c.id,c])).values()];staffRender(route==='campaign');}}catch(e){$('#main').innerHTML=`<div class="empty"><h3>연결을 확인해 주세요.</h3><p>${A().esc(e.message)}</p><button id="retryPrivate">다시 시도</button><button id="signout">계정 변경</button></div>`;$('#retryPrivate').onclick=()=>render(route);$('#signout').onclick=logout;}}
  function staffRender(campaignMode=false){const d=staffData;$('#main').innerHTML=`<div class="page-title"><span class="eyebrow">STAFF LEARNING</span><h1>${campaignMode?'월간 안전캠페인':'교육·자료'}</h1><p>${A().esc(session.email)} · 안전교육과 AI 업무 활용 자료</p></div><div class="staff-toolbar"><input id="staffSearch" type="search" placeholder="교육영상·내부 자료 검색" aria-label="직원 자료 검색"><select id="staffCategory" aria-label="직원 자료 카테고리"><option value="">모든 카테고리</option>${d.categories.map(c=>`<option value="${A().esc(c.id)}">${A().esc(c.name)}</option>`).join('')}</select>${campaignMode?`<select id="staffCampaign" aria-label="캠페인 선택"><option value="">전체 캠페인</option>${[...d.campaigns].sort((a,b)=>b.month.localeCompare(a.month)).map(c=>`<option value="${A().esc(c.id)}">${A().esc(c.month+' · '+c.title)}</option>`).join('')}</select>`:''}<button id="myReports">내 보고 기록</button><button id="signout">로그아웃</button></div><div class="detail-note">영상·카드뉴스·문서를 한곳에서 확인하세요.</div><div class="card-grid section" id="staffResults"></div>`;function filtered(){const q=$('#staffSearch').value.toLowerCase(),cat=$('#staffCategory').value,camp=$('#staffCampaign')?.value||'';const rows=d.contents.filter(c=>(!campaignMode||!!c.campaignId)&&(!camp||c.campaignId===camp)&&(!cat||c.categoryId===cat)&&[c.title,c.summary,c.body].join(' ').toLowerCase().includes(q)).sort((a,b)=>Number(a.order||0)-Number(b.order||0)||String(b.date||'').localeCompare(String(a.date||'')));$('#staffResults').innerHTML=rows.length?rows.map(c=>`<article class="content-card"><div class="art ${c.categoryId==='ai'?'ai':''}"><span class="art-label">STAFF LEARNING</span><span class="art-title">${A().esc(c.title)}</span>${A().icon(c.format==='video'?'book':'file')}</div><div class="card-copy"><span class="format">${A().esc(A().formats[c.format]||'자료')}</span><h3>${A().esc(c.title)}</h3><p>${A().esc(c.summary)}</p><button class="text-button" data-staff-content="${A().esc(c.id)}">${c.format==='video'?'영상 보기':'자료 보기'} ↗</button></div></article>`).join(''):'<div class="empty">조건에 맞는 직원 자료가 없습니다.</div>';$('#staffResults').querySelectorAll('[data-staff-content]').forEach(b=>b.onclick=()=>staffDetail(d.contents.find(c=>c.id===b.dataset.staffContent)));}$('#staffSearch').oninput=filtered;$('#staffCategory').onchange=filtered;if($('#staffCampaign'))$('#staffCampaign').onchange=filtered;$('#signout').onclick=logout;$('#myReports').onclick=()=>location.hash='records';filtered();}
  function staffDetail(c){A().showDialog(c.title,`<p class="detail-summary">${A().esc(c.summary)}</p><div class="body-text">${A().esc(c.body)}</div>${A().mediaPreview(c.url,c.format,c.title)}<div class="detail-links">${A().link(c.url,c.format==='video'?'Drive에서 직접 열기 ↗':'원본 자료 열기 ↗')}${A().attachmentControls(c.attachments)}</div>`);A().bindAttachmentPreview(c.attachments,()=>staffDetail(c));}
  function reportTable(rows){return `<div class="table-scroll"><table class="admin-table"><thead><tr><th>기록번호</th><th>종류·일시</th><th>부서·검사관</th><th>현장</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${A().esc(r.recordNo)}</td><td>${A().esc(r.kind)}<br><small>${A().esc(r.when?.replace('T',' '))}</small></td><td>${A().esc(r.department)}<br><small>${A().esc(r.inspector)}</small></td><td>${A().esc(KCA_SAFETY.sites[r.site]?.name)}<br><small>${A().esc(r.region)}</small></td><td><button data-report-view="${A().esc(r.id)}">확인</button></td></tr>`).join('')||'<tr><td colspan="5">저장된 기록이 없습니다.</td></tr>'}</tbody></table></div>`;}
  function bindReportView(rows){document.querySelectorAll('[data-report-view]').forEach(b=>b.onclick=()=>{const r=rows.find(r=>r.id===b.dataset.reportView);A().showDialog(r.recordNo,KCA_REPORTS.reportHtml(r)+`<p class="detail-meta">실제 저장됨 · ${A().esc(r.updatedAt)} · 작성계정 ${A().esc(r.actor)}</p>`);});}
  function adminRender(demo){const d=adminData;$('#main').innerHTML=`<div class="page-title admin-title"><div><span class="eyebrow">CONTENT MANAGEMENT</span><h1>운영 관리</h1><p>콘텐츠 정정, 카테고리 확장과 기록 보관 · KCA 부산본부</p></div><div>${demo?'<span class="sample-badge">편집 화면 구성 예시 · 저장 연결 전</span>':`<span>${A().esc(session.email)}</span><button class="outline-btn" id="signout">로그아웃</button>`}</div></div><div class="admin-tabs">${Object.entries(labels).map(([k,v])=>`<button class="${tab===k?'active':''}" data-admin-tab="${k}">${v}</button>`).join('')}</div><div class="admin-tools"><strong>${labels[tab]}</strong><span>${['reports','history','settings'].includes(tab)?'':`<button class="outline-btn" id="newEntity">새 항목 추가</button>`}<button class="outline-btn" id="backupData">전체 자료 백업</button></span></div><div id="adminPanel"></div>`;if($('#signout'))$('#signout').onclick=logout;document.querySelectorAll('[data-admin-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.adminTab;adminRender(demo);});$('#backupData').onclick=async()=>{if(demo){A().toast('백업은 실제 Google 저장소 연결 후 이용합니다.');return;}try{downloadJson(await rpc('exportBackup',{}),'KCA_전체백업');}catch(e){A().toast(e.message);}};if($('#newEntity'))$('#newEntity').onclick=()=>editEntity(tab,null,demo);
    const p=$('#adminPanel');if(tab==='reports'){p.innerHTML=`<p class="form-hint">최근 500건을 표시합니다. 전체 기록은 백업에 포함됩니다.</p><button class="outline-btn" id="reportCsv">현재 기록 CSV 내보내기</button>${reportTable(d.reports)}`;bindReportView(d.reports);$('#reportCsv').onclick=()=>exportCsv(d.reports);return;}
    if(tab==='history'){p.innerHTML=`<div class="table-scroll"><table class="admin-table"><thead><tr><th>일시</th><th>대상</th><th>수정 사유</th><th>수정자</th><th>복원</th></tr></thead><tbody>${d.history.map(h=>`<tr><td>${A().esc(h.updatedAt)}</td><td>${A().esc(labels[h.kind]||h.kind)}<br><small>${A().esc(h.after?.title||h.targetId)}</small></td><td>${A().esc(h.reason)}</td><td>${A().esc(h.actor)}</td><td>${h.kind==='contents'&&h.before?`<button data-restore="${A().esc(h.id)}">이전 버전 복원</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">실제 저장 시 수정 이력이 생성됩니다.</td></tr>'}</tbody></table></div>`;p.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{const h=d.history.find(h=>h.id===b.dataset.restore),c=d.contents.find(c=>c.id===h.targetId);try{b.disabled=true;await rpc('restoreContent',{historyId:h.id,revision:c.revision});await render('admin');A().toast('이전 내용을 새 버전으로 복원했습니다.');}catch(e){b.disabled=false;A().toast(e.message);}});return;}
    if(tab==='settings'){p.innerHTML='<p>첫 화면 안내와 대표 캠페인을 편집합니다.</p><button class="outline-btn" id="editSettings">포털 설정 편집</button>';$('#editSettings').onclick=()=>editEntity('settings',d.settings[0],demo);return;}
    const rows=d[tab]||[];p.innerHTML=`<div class="table-scroll"><table class="admin-table"><thead><tr><th>항목</th><th>분류·역할</th><th>상태</th><th>순서·버전</th><th>편집</th></tr></thead><tbody>${rows.map(c=>`<tr><td><strong>${A().esc(c.title||c.name||c.email)}</strong>${c.summary?`<br><small>${A().esc(c.summary)}</small>`:''}</td><td>${A().esc(tab==='contents'?(d.categories.find(x=>x.id===c.categoryId)?.name||'미분류'):c.parentId?(d.categories.find(x=>x.id===c.parentId)?.name||'상위 분류'):c.role||c.month||'상위 분류')}</td><td>${A().esc(c.status||((c.active!==false)?'사용':'비활성'))}${c.visibility?` · ${c.visibility==='staff'?'직원용':'공개'}`:''}</td><td>${A().esc(c.order??'-')} / v${A().esc(c.revision||0)}</td><td><button data-edit="${A().esc(c.id)}">수정</button></td></tr>`).join('')||'<tr><td colspan="5">등록된 항목이 없습니다.</td></tr>'}</tbody></table></div>${tab==='contents'?'<p class="form-hint">대용량 파일은 Drive에 업로드하고 원본 링크를 등록하세요. 영상은 직원 자료로 관리합니다.</p><button class="outline-btn" id="importContent">콘텐츠 JSON 일괄 등록</button>':''}`;p.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editEntity(tab,rows.find(x=>x.id===b.dataset.edit),demo));if($('#importContent'))$('#importContent').onclick=()=>importContent(demo);
  }
  function field(name,label,value='',type='text',required=false){return `<label>${label}<input name="${name}" type="${type}" value="${A().esc(value)}" ${required?'required':''}></label>`;}
  function select(name,label,items,value){return `<label>${label}<select name="${name}">${items.map(([v,t])=>`<option value="${A().esc(v)}" ${value===v?'selected':''}>${A().esc(t)}</option>`).join('')}</select></label>`;}
  function editEntity(kind,old,demo){const o=old||{id:kind==='settings'?'portal':'c_'+crypto.randomUUID().replaceAll('-',''),revision:0,order:10,active:true,visibility:'staff',status:'draft',format:'article'},d=adminData;let fields='';
    if(kind==='contents'){fields=field('title','제목',o.title,'text',true)+select('categoryId','카테고리',d.categories.filter(c=>c.active!==false).map(c=>[c.id,c.name]),o.categoryId)+field('summary','요약',o.summary)+select('format','자료형식',Object.entries(A().formats),o.format)+select('campaignId','관련 캠페인',[['','연결 없음'],...d.campaigns.map(c=>[c.id,c.title])],o.campaignId)+select('visibility','열람 범위',[['staff','직원용'],['public','공개']],o.visibility)+select('status','게시 상태',[['draft','임시저장'],['published','게시'],['archived','보관·노출중단']],o.status)+field('order','노출 순서',o.order,'number')+field('date','자료 게시·개정일',o.date,'date')+field('duration','교육시간 표시',o.duration)+field('url','원본 링크 · 영상은 Drive',o.url,'url')+field('thumbnail','썸네일 이미지 링크 (선택)',o.thumbnail,'url')+`<label class="full">본문<textarea name="body" rows="7" maxlength="8000">${A().esc(o.body)}</textarea></label><label class="full">추가 자료 링크 · 한 줄에 이름 | URL | 형식<textarea name="attachments" rows="4" placeholder="요약 PDF | https://drive.google.com/... | pdf">${A().esc((o.attachments||[]).map(a=>[a.label,a.url,a.format].join(' | ')).join('\n'))}</textarea></label>`;}
    if(kind==='categories')fields=field('name','카테고리 이름',o.name,'text',true)+select('parentId','상위 카테고리',[['','최상위'],...d.categories.filter(c=>c.id!==o.id).map(c=>[c.id,c.name])],o.parentId)+field('order','노출 순서',o.order,'number')+select('active','사용 여부',[['true','사용'],['false','비활성']],String(o.active!==false));
    if(kind==='campaigns')fields=field('title','캠페인 제목',o.title,'text',true)+field('month','캠페인 월',o.month,'month',true)+field('summary','캠페인 설명',o.summary)+select('visibility','열람 범위',[['staff','직원용'],['public','공개']],o.visibility)+select('status','게시 상태',[['draft','임시저장'],['published','게시'],['archived','보관']],o.status)+field('order','노출 순서',o.order,'number');
    if(kind==='members')fields=field('email','허용할 Google 계정 이메일',o.email,'email',true)+select('role','역할',[['staff','직원'],['admin','관리자']],o.role)+select('active','사용 여부',[['true','사용'],['false','사용 중지']],String(o.active!==false));
    if(kind==='settings')fields='<p class="full">운영부서 · KCA 부산본부</p>'+field('intro','포털 소개',o.intro)+field('notice','첫 화면 안내',o.notice)+select('featuredCampaignId','대표 캠페인',[['','자동 선택'],...d.campaigns.filter(c=>c.visibility==='public').map(c=>[c.id,c.title])],o.featuredCampaignId);
    A().showDialog((old?'수정':'새 항목 등록')+' · '+labels[kind],`<form id="entityForm"><div class="form-grid">${fields}<label class="full">등록·수정 사유<input name="changeReason" required maxlength="250" placeholder="예: 매뉴얼 개정 반영, 링크 정정, 월간 자료 등록"></label></div><p class="form-hint">${demo?'편집 구성 예시입니다. 실제 저장은 Google 연결 후 가능합니다.':'저장하면 Google Sheets에 기록하고 이전 버전을 수정 이력으로 보관합니다.'}</p><button type="submit" class="save-report">${demo?'Google 연결 후 저장 가능':'내용 저장'}</button><p id="entityStatus" role="status"></p></form>`);
    const f=$('#entityForm');if(kind==='contents')f.elements.format.onchange=()=>{if(f.elements.format.value==='video')f.elements.visibility.value='staff';};f.onsubmit=async e=>{e.preventDefault();if(!f.reportValidity())return;const t=$('#entityStatus');if(demo){t.textContent='저장되지 않았습니다. 실제 Google 저장소 연결 후 사용하세요.';return;}const values=Object.fromEntries(new FormData(f)),item={...o,...values};delete item.changeReason;for(const k of ['order','revision'])if(item[k]!==undefined)item[k]=Number(item[k]);if(item.active!==undefined)item.active=item.active==='true'||item.active===true;if(kind==='members')item.id=item.email.toLowerCase();if(kind==='contents'){try{item.attachments=values.attachments.split('\n').filter(x=>x.trim()).map(line=>{const p=line.split('|').map(s=>s.trim());if(p.length!==3||!A().safeUrl(p[1]))throw Error('추가 자료의 이름 | HTTPS 링크 | 형식을 확인하세요.');return {label:p[0],url:p[1],format:p[2]};});}catch(err){t.textContent=err.message;return;}}const b=f.querySelector('[type=submit]');b.disabled=true;t.textContent='Google 저장소에 저장 중…';try{await rpc('saveEntity',{kind,item,reason:values.changeReason});$('#detail').close();await render('admin');A().load();A().toast('저장 완료 · 수정 이력을 보관했습니다.');}catch(err){t.textContent=err.message;b.disabled=false;}};
  }
  function downloadJson(obj,name){download(new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),name+'_'+new Date().toISOString().slice(0,10)+'.json');}
  function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
  function exportCsv(rows){const headers=['기록번호','종류','소속','검사관','일시(한국)','시도','주소','상세위치','현장유형','판단','위험요인','사유','조치','담당관직접보고','사진링크',...KCA_SAFETY.checks];const keys=['recordNo','kind','department','inspector','when','region','address','place','site','decision','risks','reason','action','notified','photoUrl'];const cell=s=>{s=String(s??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const lines=[headers,...rows.map(r=>[...keys.map(k=>Array.isArray(r[k])?r[k].join(', '):r[k]),...KCA_SAFETY.checks.map((_,i)=>r.checks?.[i]||'')])].map(r=>r.map(cell).join(','));download(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),'KCA_안전기록.csv');}
  function importContent(demo){A().showDialog('콘텐츠 JSON 일괄 등록','<p>최대 100개 신규 콘텐츠를 등록합니다. id, title, categoryId, format, visibility, status, url 등을 포함한 JSON 배열을 입력하세요. 기존 항목은 덮어쓰지 않습니다.</p><textarea id="importJson" rows="10" style="width:100%" aria-label="신규 콘텐츠 JSON"></textarea><button id="runImport" class="save-report">신규 자료 등록</button><p id="importStatus" role="status"></p>');$('#runImport').onclick=async()=>{const t=$('#importStatus');if(demo){t.textContent='Google 연결 전입니다. 저장하지 않았습니다.';return;}let items;try{items=JSON.parse($('#importJson').value);if(!Array.isArray(items)||items.length>100)throw Error('100개 이하의 JSON 배열을 입력하세요.');if(items.some(i=>i.id&&adminData.contents.some(c=>c.id===i.id)))throw Error('기존 콘텐츠 식별자가 포함되어 있습니다. 개별 수정 기능을 이용하세요.');}catch(e){t.textContent=e.message;return;}$('#runImport').disabled=true;let done=0;try{for(const i of items){await rpc('saveEntity',{kind:'contents',item:{summary:'',body:'',campaignId:'',url:'',thumbnail:'',date:'',duration:'',attachments:[],order:10,status:'draft',visibility:'staff',format:'article',...i,id:i.id||'c_'+crypto.randomUUID().replaceAll('-',''),revision:0},reason:'신규 콘텐츠 일괄 등록'});done++;t.textContent=`${done}/${items.length}건 저장 완료`;}}catch(e){t.textContent=`${done}건 저장됨. 이후 등록은 중단했습니다: ${e.message}`;}$('#runImport').disabled=false;};}
  window.KCA_MANAGEMENT={render};
})();
</script></body>
