 async function compressPhoto(file){if(!file.type.startsWith('image/')||file.type==='image/svg+xml'||file.size>40000000)throw Error('40MB 이하 사진 파일을 선택해 주세요.');const bitmap=await createImageBitmap(file),ratio=Math.min(1,1280/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();let quality=.82,src=canvas.toDataURL('image/jpeg',quality);while(src.length>1250000&&quality>.35){quality-=.1;src=canvas.toDataURL('image/jpeg',quality);}if(src.length>1250000)throw Error('사진 크기가 큽니다. 작은 사진을 선택해 주세요.');return {src,name:file.name};}

   const selected=async e=>{const files=[...e.target.files],photos=photoBuffers.get(d.id)||[];if(photos.length+files.length>3){$('#stopPhotoStatus').textContent='사진은 최대 3장입니다.';e.target.value='';return;}$('#stopPhotoStatus').textContent='사진을 준비합니다…';try{const added=[];for(const f of files)added.push(await compressPhoto(f));photos.push(...added);photoBuffers.set(d.id,photos);d.photos=[];d.photoUrl='';dirty=true;render();$('#stopPhotoStatus').textContent=photos.length+'장 선택 · 기록 저장 시 함께 업로드됩니다.';}catch(err){$('#stopPhotoStatus').textContent=err.message||'사진을 읽지 못했습니다. JPEG·PNG 사진을 선택해 주세요.';}e.target.value='';};

 function stopStyles(){return `.stop-sheet{background:white;color:#111;margin:0 auto;max-width:760px}.stop-sheet h2{text-align:center;font-size:22px;margin:18px 0 24px}.stop-sheet table{border-collapse:collapse;width:100%;table-layout:fixed}.stop-sheet th,.stop-sheet td{border:1px solid #222;font-weight:400;font-size:13px;padding:10px;word-break:break-word}.stop-sheet th{width:25%;text-align:center}.stop-sheet .stop-reason{height:95px;white-space:pre-wrap}.stop-sheet .stop-photo{height:320px;vertical-align:middle}.stop-sheet input,.stop-sheet textarea{width:100%;border:1px solid #b9c8c0;border-radius:5px;padding:10px;font:inherit;background:#fbfdfb}.stop-sheet textarea{min-height:95px;resize:vertical}.stop-sheet .photo-link{font-size:12px;word-break:break-all}.stop-sheet .stop-photo-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}.stop-sheet .stop-photo-gallery figure{margin:0}.stop-sheet .stop-photo-gallery img{width:100%;max-height:300px;object-fit:contain}.stop-sheet .stop-photo-gallery img[hidden]{display:none}.stop-sheet .media-preview{margin:0}.stop-sheet .document-preview iframe{height:310px}.stop-sheet .media-hint{font-size:10px}@media print{.stop-sheet{width:100%;max-width:none}.stop-sheet .stop-photo{height:120mm}.stop-sheet th,.stop-sheet td{border:1px solid black}.stop-sheet .media-hint{display:none}.stop-sheet h2{margin-top:10mm}.stop-sheet .stop-reason{height:32mm}}`;}

 function renderStop(){const k='stop',d=drafts[k]||(drafts[k]=blank(k));$('#main').innerHTML=`<div class="simple-report"><div class="page-title"><span class="eyebrow">STOP WORK</span><h1>작업중지권 작성</h1><p>먼저 중지·대피하고 안전담당관에게 직접 보고하세요.</p></div><form id="reportForm" class="report-form manual-stop-form"><p class="form-hint">매뉴얼 2.10 양식 · 날짜는 실제 발생일로 지정하세요. 저장 시각은 별도로 기록합니다.</p><details class="compact-details"><summary>상황별 사유 초안 도움</summary><label class="block-label">현장 유형<select id="stopGuideSite">${Object.entries(S().sites).map(([key,v])=>`<option value="${key}" ${d.site===key?'selected':''}>${A().esc(v.name)}</option>`).join('')}</select></label><label class="block-label">위험 상황<select id="stopGuideRisk"><option value="">선택</option>${S().risks.map(v=>`<option>${A().esc(v)}</option>`).join('')}</select></label><label class="block-label">체감온도 °C (선택)<input id="stopGuideFeels" type="number" min="-50" max="70" step="0.1" aria-label="사유 도움 체감온도"></label><button type="button" class="outline-btn" id="fillStopReason">사유 초안 채우기</button></details>${stopSheet(d,true)}<div class="simple-save"><button type="submit" class="save-report">작업중지 기록 저장</button><button type="button" class="outline-btn" id="previewReport">양식 미리보기</button></div><p id="saveStatus" class="save-status" role="status">${window.KCA_AUTH?.session?'로그인되어 있습니다.':A().apiUrl()?'처음 저장할 때 Google 로그인이 필요합니다.':'시안 · 실제 저장 전'}</p><p class="form-hint">위험이 해소되기 전에는 재개하지 않습니다.</p></form><div class="source-note">${A().esc(S().source)} · 2.10 / p.35 · ${A().esc(S().version)}</div></div>`;const f=$('#reportForm');f.oninput=()=>{capture(k);dirty=true;};$('#locate').onclick=()=>locate(k);bindPhotoUpload(d);$('#fillStopReason').onclick=()=>{d.site=$('#stopGuideSite').value;d.risks=$('#stopGuideRisk').value?[$('#stopGuideRisk').value]:[];d.feelsLike=$('#stopGuideFeels').value;const text=(S().sites[d.site]?.name||'현장')+' / '+(d.risks.join('·')||'현장 위험')+'\n'+KCA_GUIDANCE.plan(d);$('#reportForm').elements.reason.value=text;d.reason=text   function connectionScreen(route){$('#main').innerHTML=`<div class="page-title"><span class="eyebrow">${route==='admin'?'CONTENT MANAGEMENT':'STAFF LEARNING'}</span><h1>${route==='admin'?'관리자 편집':route==='records'?'내 보고 기록':route==='campaign'?'월간 안전캠페인':'교육·자료'}</h1><p>Google 계정 권한을 확인하고 이용합니다.</p></div><div class="empty"><h3>${configured()?'허용된 Google 계정으로 로그인하세요.':'Google 연결을 준비하고 있습니다.'}</h3><p>${configured()?'등록된 계정으로 로그인하면 보고 기록과 교육자료를 볼 수 있습니다.':'실제 자료와 계정 연결 전입니다. 편집 화면의 구성은 미리 확인할 수 있습니다.'}</p>${configured()?'<button id="loginPage" class="save-report">Google 로그인</button>':'<a class="primary" href="portal-guide.html" target="_blank" rel="noopener">연결·운영 안내 ↗</a>'}${route==='admin'&&!configured()?'<button id="previewAdmin">관리자 화면 구성 보기</button>':''}</div>`;if($('#previewAdmin'))$('#previewAdmin').onclick=()=>{const d=A().state.data;adminData={contents:d.contents,categories:d.categories,campaigns:d.campaigns,settings:[{id:'portal',...d.settings,revision:0}],members:[],reports:[],history:[]};adminRender(true);};if($('#loginPage'))$('#loginPage').onclick=async()=>{try{await ensureLogin();render(route);}catch(e){A().toast(e.message);}};}

    if(kind==='members')fields=field('email','허용할 Google 계정 이메일',o.email,'email',true)+select('role','역할',[['staff','직원'],['admin','관리자']],o.role)+select('active','사용 여부',[['true','사용'],['false','사용 중지']],String(o.active!==false));
    if(kind==='settings')fields='<p class="full">운영부서 · KCA 부산본부</p>'+field('intro','포털 소개',o.intro)+field('notice','첫 화면 안내',o.notice)+select('featuredCampaignId','대표 캠페인',[['','자동 선택'],...d.campaigns.filter(c=>c.visibility==='public').map(c=>[c.id,c.title])],o.featuredCampaignId);
    A().showDialog((old?'수정':'새 항목 등록')+' · '+labels[kind],`<form id="entityForm"><div class="form-grid">${fields}<label class="full">등록·수정 사유<input name="changeReason" required maxlength="250" placeholder="예: 매뉴얼 개정 반영, 링크 정정, 월간 자료 등록"></label></div><p class="form-hint">${demo?'편집 구성 예시입니다. 실제 저장은 Google 연결 후 가능합니다.':'저장하면 Google Sheets에 기록하고 이전 버전을 수정 이력으로 보관합니다.'}</p><button type="submit" class="save-report">${demo?'Google 연결 후 저장 가능':'내용 저장'}</button><p id="entityStatus" role="status"></p></form>`);
    const f=$('#entityForm');if(kind==='contents')f.elements.format.onchange=()=>{if(!f.elements.visibility.value)f.elements.visibility.value='password';};f.onsubmit=async e=>{e.preventDefault();if(!f.reportValidity())return;const t=$('#entityStatus');if(demo){t.textContent='저장되지 않았습니다. 실제 Google 저장소 연결 후 사용하세요.';return;}const values=Object.fromEntries(new FormData(f)),item={...o,...values};delete item.changeReason;for(const k of ['order','revision'])if(item[k]!==undefined)item[k]=Number(item[k]);if(item.active!==undefined)item.active=item.active==='true'||item.active===true;if(kind==='members')item.id=item.email.toLowerCase();if(kind==='contents'){try{item.attachments=values.attachments.split('\n').filter(x=>x.trim()).map(line=>{const p=line.split('|').map(s=>s.trim());if(p.length!==3||!A().safeUrl(p[1]))throw Error('추가 자료의 이름 | HTTPS 링크 | 형식을 확인하세요.');return {label:p[0],url:p[1],format:p[2]};});}catch(err){t.textContent=err.message;return;}}const b=f.querySelector('[type=submit]');b.disabled=true;t.textContent='Google 저장소에 저장 중…';try{await rpc('saveEntity',{kind,item,reason:values.changeReason});$('#detail').close();await render('admin');A().load();A().toast('저장 완료 · 수정 이력을 보관했습니다.');}catch(err){t.textContent=err.message;b.disabled=false;}};
  }
  function downloadJson(obj,name){download(new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),name+'_'+new Date().toISOString().slice(0,10)+'.json');}
  function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
  function exportCsv(rows){const headers=['기록번호','종류','소속','검사관','일시(한국)','시도','주소','상세위치','현장유형','판단','위험요인','사유','조치','담당관직접보고','사진링크',...KCA_SAFETY.checks];const keys=['recordNo','kind','department','inspector','when','region','address','place','site','decision','risks','reason','action','notified','photoUrl'];const cell=s=>{s=String(s??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const lines=[headers,...rows.map(r=>[...keys.map(k=>Array.isArray(r[k])?r[k].join(', '):r[k]),...KCA_SAFETY.checks.map((_,i)=>r.checks?.[i]||'')])].map(r=>r.map(cell).join(','));download(new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),'KCA_안전기록.csv');}
  function importContent(demo){A().showDialog('콘텐츠 JSON 일괄 등록','<p>최대 100개 신규 콘텐츠를 등록합니다. id, title, categoryId, format, visibility, status, url 등을 포함한 JSON 배열을 입력하세요. 기존 항목은 덮어쓰지 않습니다.</p><textarea id="importJson" rows="10" style="width:100%" aria-label="신규 콘텐츠 JSON"></textarea><button id="runImport" class="save-report">신규 자료 등록</button><p id="importStatus" role="status"></p>');$('#runImport').onclick=async()=>{const t=$('#importStatus');if(demo){t.textContent='Google 연결 전입니다. 저장하지 않았습니다.';return;}let items;try{items=JSON.parse($('#importJson').value);if(!Array.isArray(items)||items.length>100)throw Error('100개 이하의 JSON 배열을 입력하세요.');if(items.some(i=>i.id&&adminData.contents.some(c=>c.id===i.id)))throw Error('기존 콘텐츠 식별자가 포함되어 있습니다. 개별 수정 기능을 이용하세요.');}catch(e){t.textContent=e.message;return;}$('#runImport').disabled=true;let done=0;try{for(const i of items){await rpc('saveEntity',{kind:'contents',item:{summary:'',body:'',campaignId:'',url:'',thumbnail:'',date:'',duration:'',attachments:[],order:10,status:'draft',visibility:'staff',format:'article',...i,id:i.id||'c_'+crypto.randomUUID().replaceAll('-',''),revision:0},reason:'신규 콘텐츠 일괄 등록'});done++;t.textContent=`${done}/${items.length}건 저장 완료`;}}catch(e){t.textContent=`${done}건 저장됨. 이후 등록은 중단했습니다: ${e.message}`;}$('#runImport').disabled=false;};}
  window.KCA_MANAGEMENT={render};
})();
</script></body>
